# The test environment (docs/CONTAINERS.md): every recipe, build and
# server, and every command an agent runs to test, runs in it, through
# scripts/dev; the host needs a container runtime and nothing else.
#
#   scripts/dev just test
#
# It never makes a change. This repository is mounted read-only at
# /src/cartograph-ui, and each command runs in a copy synced from it
# into the cartograph-ui-workspace volume first, so dependencies, builds
# and generated files stay in the container and the working tree is
# never written. Changes are made, described and pushed on the host,
# with jj from the flake.
#
# /nix is the cartograph-nix volume, the one the engine's environment
# uses too: every instance and run of either shares it, and nothing is
# fetched twice. Where CARTOGRAPH_NIX_STORE names a directory, /nix is
# that directory instead. /tmp is a tmpfs. Host networking lets a
# browser on the host reach a server started inside.

name: cartograph-ui-dev

services:
  dev:
    build:
      context: deploy/dev
      dockerfile: Containerfile
    image: cartograph-ui-dev:local
    user: "${CARTOGRAPH_UID:-1000}:${CARTOGRAPH_GID:-1000}"
    working_dir: /workspace/cartograph-ui
    network_mode: host
    init: true
    volumes:
      - .:/src/cartograph-ui:ro
      - cartograph-ui-workspace:/workspace
      - ${CARTOGRAPH_NIX_STORE:-cartograph-nix}:/nix
      - cartograph-home:/home/dev
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      HOME: /home/dev

volumes:
  cartograph-ui-workspace:
    name: cartograph-ui-workspace
  cartograph-nix:
    name: cartograph-nix
  cartograph-home:
    name: cartograph-home
