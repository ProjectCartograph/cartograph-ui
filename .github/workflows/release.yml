name: release

# A release is a tag v<version> (VERSIONING.md in cartograph-engine
# describes the scheme). The build the engine embeds is attached.
on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          save: false
      - run: nix develop --command just dist-tarball
      - uses: softprops/action-gh-release@v2
        with:
          files: dist.tar.gz
          generate_release_notes: true
