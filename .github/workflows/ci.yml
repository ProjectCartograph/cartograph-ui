name: ci

on:
  push:
    branches: [main]
  pull_request:

# The Nix caches, each its own switch, so both may be on: the Actions
# cache (repository variable CARTOGRAPH_CACHE_GHA, on unless set to off)
# and Cachix (CARTOGRAPH_CACHIX, a cache name, with the secret
# CACHIX_AUTH_TOKEN; off unless set).
env:
  CARTOGRAPH_CACHE_GHA: ${{ vars.CARTOGRAPH_CACHE_GHA || 'on' }}
  CARTOGRAPH_CACHIX: ${{ vars.CARTOGRAPH_CACHIX }}

permissions:
  contents: read
  # magic-nix-cache asks for a token to reach the Actions cache.
  id-token: write

jobs:
  ci:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built.
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --command just ci
      - run: nix develop --command just dist-tarball
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist.tar.gz

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built.
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --command just commit-check origin/${{ github.base_ref }}
