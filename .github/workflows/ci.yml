name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # cache-nix-action purges its own old entries.
  actions: write

jobs:
  ci:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix develop --command just ci
      - run: nix develop --command just dist-tarball
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist.tar.gz

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'package-lock.json') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          save: false
      - run: nix develop --command just commit-check origin/${{ github.base_ref }}
